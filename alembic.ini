[alembic]
script_location = backend/migrations
prepend_sys_path = .
version_path_separator = os

# URL sengaja TIDAK ditulis di sini. env.py membacanya dari
# `backend.core.config.settings.database_url` supaya hanya ada satu sumber
# kebenaran dan tidak ada kredensial/ path yang dobel.
# sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S